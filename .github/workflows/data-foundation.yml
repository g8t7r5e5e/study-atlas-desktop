name: Data foundation checks
on:
  pull_request:
  push:
    branches: [main, feature/usmle-data-and-study-planner]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r desktop/data_foundation/requirements.txt
      - run: python -m unittest discover -s data_foundation/tests -v
        working-directory: desktop
      - run: node scripts/verify-reference.cjs
      - run: node scripts/smoke-reference.cjs
      - run: python -m data_foundation.package --root .. --output ../artifacts/usmle_step1_research_and_data_package.zip
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: usmle-data-foundation-shareable
          path: |
            artifacts/usmle_step1_research_and_data_package.zip
            artifacts/usmle_step1_research_and_data_package.sha256
            artifacts/usmle_step1_research_and_data_package.verification.json
          if-no-files-found: error
